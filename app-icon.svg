<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring (Representing Renewal/Subscriptions) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-dasharray="800" stroke-dashoffset="120" opacity="0.3" />

  <!-- Main Symbol Container -->
  <g filter="url(#shadow)">
    <!-- Recurring Arrow Circle (Subscription Cycle) -->
    <path d="M 256 96 C 344.37 96 416 167.63 416 256 C 416 344.37 344.37 416 256 416 C 180.5 416 117.2 363.6 100.8 292" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          filter="url(#glow)" />
    
    <!-- Arrow Head -->
    <path d="M 124 308 L 96 276 L 68 308" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sleek Credit Card / Subscription Badge -->
    <rect x="166" y="186" width="200" height="130" rx="20" fill="url(#cardGrad)" transform="rotate(-12 266 251)" opacity="0.95" />
    <rect x="180" y="210" width="172" height="24" rx="4" fill="#0f172a" transform="rotate(-12 266 251)" opacity="0.4" />
    <circle cx="210" cy="270" r="14" fill="#fbbf24" transform="rotate(-12 266 251)" opacity="0.9" />

    <!-- Dollar / Currency Central Symbol -->
    <circle cx="256" cy="256" r="54" fill="#10b981" />
    <text x="256" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="52" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
